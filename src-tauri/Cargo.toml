[package]
name = "meshkeep"
description = "Meshkeep desktop app (Tauri shell over meshkeep-engine)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "meshkeep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
meshkeep-engine = { path = "../crates/engine" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-log = "2.10"
log = "0.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
# WebdriverIO support; only compiled with `--features e2e` (plus tauri.e2e.conf.json).
tauri-plugin-wdio = { version = "1.5", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }

[features]
default = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
