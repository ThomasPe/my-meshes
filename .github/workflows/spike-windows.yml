name: Spike · Tauri on Windows

on:
  push:
    branches: ['claude/**', 'spike/**', 'main']
    paths: ['spike/**', '.github/workflows/spike-windows.yml']
  workflow_dispatch:

concurrency:
  group: spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    name: build · e2e · msix
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: spike
        shell: pwsh
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spike/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike/src-tauri -> target
          key: spike

      - name: Environment
        run: |
          node --version; npm --version; cargo --version
          $edge = (Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue).pv
          Write-Host "WebView2 runtime: $edge"
          Get-WmiObject Win32_VideoController | Select-Object Name, DriverVersion | Format-Table

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Build app with WebDriver plugins (--features e2e)
        run: npm run tauri build -- --no-bundle --features e2e

      - name: E2E via WebDriver (embedded provider)
        id: e2e
        run: npm run test:e2e
        env:
          SPIKE_APP: ${{ github.workspace }}\spike\src-tauri\target\release\my-meshes-spike.exe

      - name: Spike results
        if: always()
        run: |
          if (Test-Path logs/spike-results.json) { Get-Content logs/spike-results.json } else { Write-Host "no results file" }

      - name: Build release app (without e2e plugins)
        run: npm run tauri build -- --no-bundle

      - name: Build MSIX
        run: ./msix/build-msix.ps1 -Version "0.1.0.${{ github.run_number }}"

      - name: Side-load MSIX
        run: ./msix/sideload-test.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            spike/src-tauri/target/*.msix
            spike/src-tauri/target/spike-dev.cer
            spike/logs/**
