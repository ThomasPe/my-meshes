name: Dev channel

# Every push to main or a working branch becomes an installable, self-updating build for
# Windows and macOS on the rolling pre-release tagged `dev` (the newest push wins; a build
# in progress is cancelled). Installed dev builds check that feed on startup (APP-9).
# Each platform publishes its own feed (`latest-<target>.json`) and only touches its own
# assets, so a failed macOS build leaves the Windows feed intact and vice versa. The
# release is only touched after the build succeeded, and the feed is replaced last, so
# the update feed never 404s while a build runs. The macOS build is unsigned and not
# notarized; the release notes tell testers how to open it (docs/store/README.md).
on:
  push:
    branches: ['main', 'claude/**', 'feat/**', 'fix/**']
    paths-ignore: ['docs/**', 'spike/**', 'site/**', '*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-channel
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fast iteration beats the last 10 % of binary size: no LTO, parallel codegen.
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  build:
    name: ${{ matrix.target }} · dev build + rolling pre-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            bundles: nsis
          # macos-latest is an Apple Silicon runner; the build is arm64 only. For Intel
          # Macs too, build `--target universal-apple-darwin` (needs the x86_64 target
          # installed and about twice the compile time).
          - os: macos-latest
            target: darwin
            bundles: app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dev-channel-${{ matrix.target }}
      - run: npm ci

      - name: Require the updater signing key
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY == '' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing; the dev channel cannot sign updates (docs/store/README.md)."
          exit 1

      # Version: <package.json version>-dev.<run number>, strictly increasing per build and
      # below the next stable release in semver order. Merged into the dev overlay.
      - name: Dev overlay with build version
        id: ver
        run: |
          version="$(jq -r .version package.json)-dev.${{ github.run_number }}"
          jq --arg v "$version" '. + {version: $v}' src-tauri/tauri.updater.dev.conf.json > src-tauri/tauri.dev-build.conf.json
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and sign
        env:
          MESHKEEP_SOURCEMAP: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --features updater,devtools --bundles ${{ matrix.bundles }} --config src-tauri/tauri.dev-build.conf.json

      # Writes latest-<target>.json next to the installer and replaces this platform's
      # part of the rolling release in place (installer first, feed last, stale assets
      # afterwards). The other platform's assets are never touched.
      - name: Publish to the rolling dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: bash .github/scripts/dev-channel-publish.sh

      - uses: actions/upload-artifact@v7
        with:
          name: meshkeep-${{ steps.ver.outputs.version }}-dev-${{ matrix.target }}
          path: |
            dist-dev/*
            dist/assets/*.map
