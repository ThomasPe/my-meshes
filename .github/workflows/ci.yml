name: CI

on:
  push:
    branches: ['main', 'claude/**', 'feat/**', 'fix/**']
    paths-ignore: ['docs/**', 'spike/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', 'spike/**', '*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  engine:
    name: engine · cargo fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@v2
        with: { key: engine }
      - run: cargo fmt --all --check
      - run: cargo clippy -p meshkeep-engine --all-targets -- -D warnings
      - run: cargo test -p meshkeep-engine

  frontend:
    name: frontend · typecheck, unit, UI (browser mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "" }
      - run: npm run test:ui
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-results
          path: |
            test-results/**
            playwright-report/**

  app-windows:
    name: app · Windows build + E2E (real app, test mode)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults: { run: { shell: pwsh } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: app-windows }
      - run: npm ci
      - name: Build e2e app (WebDriver plugins + test seams)
        run: npm run tauri:build:e2e
      - name: E2E against the real app
        run: npm run test:e2e
        env:
          MESHKEEP_APP: ${{ github.workspace }}\target\release\meshkeep.exe
      - name: Release build (Store flavor, no e2e plugins, no updater)
        run: npm run tauri:build:store
      - name: MSIX (side-load) + install round trip
        run: |
          ./msix/build-msix.ps1 -Version "0.1.0.${{ github.run_number }}"
          ./msix/sideload-test.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-windows-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            logs/**
            target/release/meshkeep.exe
            target/*.msix
            target/meshkeep-dev.cer
