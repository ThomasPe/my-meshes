[workspace]
resolver = "2"
members = ["crates/engine", "src-tauri"]
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
