[package]
name = "my-meshes-spike"
version = "0.1.0"
description = "Tauri 2 de-risking spike for My Meshes"
edition = "2021"
rust-version = "1.80"

[lib]
name = "my_meshes_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rayon = "1.10"
walkdir = "2.5"
# WebdriverIO plugins. Compiled in so the capability file validates; only *registered* with the `e2e` feature,
# so a release build without the feature never starts the embedded WebDriver server.
tauri-plugin-wdio = "1.5"
tauri-plugin-wdio-webdriver = "1.5"

[features]
default = []
e2e = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
