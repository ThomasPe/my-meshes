<style>
/* My Meshes click dummy, visual direction D "Gallery" (ADR-0002).
   Layout: fixed app frame (top bar / body / status bar); body = sidebar | main | inspector.
   Light-first; dark via data-theme. Static HTML + vanilla JS, no framework, no build. */
:root{
  --bg:#f4f5f7; --panel:#ffffff; --card:#ffffff; --raised:#ffffff; --border:#e5e7eb; --border-strong:#d1d5db; --hover:#eef0f3;
  --fg:#111827; --fg-2:#374151; --muted:#6b7280; --faint:#9ca3af;

  --shadow:0 1px 2px rgba(17,24,39,.06),0 6px 16px rgba(17,24,39,.06); --shadow-hover:0 2px 4px rgba(17,24,39,.08),0 14px 28px rgba(17,24,39,.10);
  --ok:#16a34a; --ok-soft:#dcfce7; --warn:#d97706; --warn-soft:#fef3c7; --danger:#dc2626; --danger-soft:#fee2e2; --off:#9ca3af;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px; --rs:10px; --rx:8px; --tile:230px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#161920; --card:#1b1f27; --raised:#20252e; --border:#262b35; --border-strong:#343a46; --hover:#232834;
  --fg:#f3f4f6; --fg-2:#d1d5db; --muted:#9ca3af; --faint:#6b7280;
  --accent:#2dd4bf; --accent-hover:#5eead4; --accent-soft:rgba(45,212,191,.14); --accent-fg:#0f1115;
  --thumb:#e5e7eb; --thumb-fill:rgba(45,212,191,.12); --thumb-bg:linear-gradient(160deg,rgba(45,212,191,.12),#161920);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.3); --shadow-hover:0 2px 4px rgba(0,0,0,.4),0 14px 28px rgba(0,0,0,.45);
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.15); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.15); --danger:#f87171; --danger-soft:rgba(248,113,113,.15); --off:#6b7280;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#161920; --card:#1b1f27; --raised:#20252e; --border:#262b35; --border-strong:#343a46; --hover:#232834;
  --fg:#f3f4f6; --fg-2:#d1d5db; --muted:#9ca3af; --faint:#6b7280;
  --accent:#2dd4bf; --accent-hover:#5eead4; --accent-soft:rgba(45,212,191,.14); --accent-fg:#0f1115;
  --thumb:#e5e7eb; --thumb-fill:rgba(45,212,191,.12); --thumb-bg:linear-gradient(160deg,rgba(45,212,191,.12),#161920);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.3); --shadow-hover:0 2px 4px rgba(0,0,0,.4),0 14px 28px rgba(0,0,0,.45);
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.15); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.15); --danger:#f87171; --danger-soft:rgba(248,113,113,.15); --off:#6b7280;
  color-scheme:dark;
} }

*{box-sizing:border-box} html,body{height:100%;margin:0}

a{color:var(--accent)}

.hidden,[hidden]{display:none!important}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:56px 1fr 30px;height:100%;min-height:0}
.topbar{display:flex;align-items:center;gap:8px;padding:0 16px;min-width:0;overflow:hidden;background:var(--panel);border-bottom:1px solid var(--border)}

.mainnav{display:flex;gap:2px;flex:none}

.mainnav a:hover{background:var(--hover);color:var(--fg)} .mainnav a.active{background:var(--accent-soft);color:var(--accent)}
.mainnav a .n{font-size:11px;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:0 6px;line-height:16px}
.search{margin-left:auto;display:flex;align-items:center;gap:10px;flex:0 1 380px;min-width:60px;height:38px;padding:0 14px;border-radius:999px;background:var(--bg);border:1px solid var(--border);color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg)} .search input::placeholder{color:var(--faint)}
.search kbd{font:11px/1 var(--mono);padding:3px 6px;border-radius:6px;background:var(--panel);border:1px solid var(--border);color:var(--faint)}
.caption{display:flex;gap:2px;margin-left:4px}
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:999px;color:var(--muted)} .ibtn:hover{background:var(--hover);color:var(--fg)}
.ibtn.sm{width:30px;height:30px} .ibtn.sm svg{width:16px;height:16px}
.body{display:grid;grid-template-columns:250px minmax(0,1fr) 320px;min-height:0}
.body.no-inspector{grid-template-columns:250px minmax(0,1fr)}
.body.no-side{grid-template-columns:minmax(0,1fr)}
.sidebar{padding:14px 12px;overflow:auto;background:var(--panel);border-right:1px solid var(--border)}
.inspector{padding:20px;overflow:auto;background:var(--panel);border-left:1px solid var(--border)}
.main{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0}
.main.scroll{display:block;overflow:auto}
.statusbar{display:flex;align-items:center;gap:20px;padding:0 20px;background:var(--panel);border-top:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.statusbar .right{margin-left:auto;display:flex;gap:20px} .statusbar button{display:flex;align-items:center;gap:8px;color:inherit;font-weight:600} .statusbar button:hover{color:var(--fg)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none} .dot.off{background:var(--off)} .dot.warn{background:var(--warn)} .dot.busy{background:var(--accent);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.busy{animation:none}}

/* ---------- sidebar ---------- */
.sec{margin-bottom:16px} .sec h3{display:flex;align-items:center;margin:0 12px 6px;font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.08em} .sec h3 .ibtn{margin-left:auto}
.nav button,.nav a{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 12px;border-radius:var(--rs);color:var(--fg-2);text-align:left;font-weight:600;text-decoration:none}
.nav button:hover{background:var(--hover)} .nav button.active{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto;font-size:12px;color:var(--faint);font-weight:600;font-variant-numeric:tabular-nums}
.nav button.active .count{color:var(--accent)}
.tree button{height:32px;font-weight:500} .tree .d1{padding-left:28px} .tree .d2{padding-left:44px} .tree .chev{width:12px;color:var(--faint);font-size:10px;flex:none}

/* ---------- toolbar & controls ---------- */
.toolbar{display:flex;align-items:center;gap:8px;padding:14px 20px 8px;flex-wrap:wrap}
.toolbar>*{flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--border);color:var(--fg-2);font-weight:700;font-size:13px;box-shadow:var(--shadow);white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--border-strong);color:var(--fg)} .btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent} .btn.primary:hover{background:var(--accent-hover);color:var(--accent-fg)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none} .btn.danger{color:var(--danger)} .btn.sm{height:30px;padding:0 11px;font-size:12px} .btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.chip button{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;color:inherit;opacity:.7} .chip button:hover{opacity:1;background:rgba(0,0,0,.08)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--panel);border:1px solid var(--border)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;color:var(--muted);font-weight:700;font-size:13px} .seg button.on{background:var(--fg);color:var(--bg)}
.select{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px 0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);font-weight:700;font-size:13px;color:var(--fg-2)}
.select select{appearance:none;background:none;border:0;outline:0;font-weight:700;color:var(--fg-2);padding-right:18px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:right 6px top 55%,right 1px top 55%;background-size:5px 5px;background-repeat:no-repeat}
.zoom{display:flex;align-items:center;gap:10px;color:var(--muted);margin-left:auto;font-weight:600;font-size:12px}
input[type=range]{accent-color:var(--accent);width:84px}
.field{display:grid;gap:6px} .field label{font-size:12px;font-weight:700;color:var(--muted)}
.input,textarea.input{height:38px;padding:0 12px;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg);color:var(--fg);width:100%;outline:0} .input:focus{border-color:var(--accent)} textarea.input{height:auto;padding:10px 12px;resize:vertical;font-family:var(--mono);font-size:12px;line-height:1.6}
.switch{position:relative;width:40px;height:22px;border-radius:999px;background:var(--border-strong);flex:none;transition:background .15s} .switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)} .switch[aria-checked="true"]{background:var(--accent)} .switch[aria-checked="true"]::after{left:21px}
.radio-cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.radio-card{display:grid;gap:4px;padding:14px;border-radius:var(--rs);border:2px solid var(--border);cursor:pointer;background:var(--panel)} .radio-card b{font-size:14px} .radio-card span{color:var(--muted);font-size:12px} .radio-card.on{border-color:var(--accent);background:var(--accent-soft)}
.tabs{display:flex;gap:6px;flex-wrap:wrap} .tab{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 16px;border-radius:999px;color:var(--muted);font-weight:700} .tab.active{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)} .tab:hover{color:var(--fg)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--panel);color:var(--fg-2);box-shadow:var(--shadow);white-space:nowrap}
.badge.off{color:var(--muted);background:var(--bg);box-shadow:none;border:1px solid var(--border)} .badge.ok{background:var(--ok-soft);color:var(--ok);box-shadow:none} .badge.warn{background:var(--warn-soft);color:var(--warn);box-shadow:none} .badge.accent{background:var(--accent-soft);color:var(--accent);box-shadow:none} .badge.danger{background:var(--danger-soft);color:var(--danger);box-shadow:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--bg);color:var(--fg-2);border:0;cursor:pointer} .tag:hover{background:var(--accent-soft);color:var(--accent)} .tag.add{border:1px dashed var(--border-strong);background:transparent;color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--border);overflow:hidden;min-width:60px} .progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.card-panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.kv{display:grid;grid-template-columns:100px 1fr;gap:10px 12px;font-size:13px} .kv dt{color:var(--faint);font-weight:600} .kv dd{margin:0;color:var(--fg-2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .kv a{text-decoration:none}
.eyebrow{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
h1.page{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em} h2.sec-title{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-size:12px}
.empty{display:grid;place-items:center;text-align:center;padding:60px 20px;color:var(--muted)} .empty .ico{width:72px;height:72px;border-radius:22px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:14px} .empty .ico svg{width:32px;height:32px} .empty b{color:var(--fg);font-size:16px}
table.t{width:100%;border-collapse:collapse;font-size:13px} .t th{text-align:left;font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap} .t td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle} .t tr:last-child td{border-bottom:0} .t tbody tr:hover td{background:var(--hover)} .t td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)} .t th.num{text-align:right} .t th button{font-weight:700;color:inherit;display:inline-flex;gap:4px;align-items:center;text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.ext{font:11px/1.8 var(--mono);color:var(--accent);text-transform:uppercase;width:34px;display:inline-block}

/* ---------- library grid & list ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));grid-auto-rows:max-content;gap:18px;padding:12px 20px 24px;overflow:auto;align-content:start}
.card{display:flex;flex-direction:column;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;outline:0;border:2px solid transparent;cursor:default;transition:transform .15s,box-shadow .15s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)} .card.selected{border-color:var(--accent)} .card.offline{opacity:.75}
.thumb{flex:none;height:0;padding-top:100%;position:relative;background:var(--thumb-bg);color:var(--thumb)}
.thumb svg.t{position:absolute;inset:0;margin:auto;width:62%;height:62%;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.thumb .tl{position:absolute;top:12px;left:12px;display:flex;gap:6px} .thumb .tr{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.thumb .fav{color:var(--warn)} .thumb.generating svg.t{opacity:.3}
.thumb .gen{position:absolute;bottom:12px;left:12px;right:12px;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.card .meta{padding:12px 14px 14px;display:grid;gap:6px} .card h4{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .card .by{color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.avatar{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:9px;font-weight:800;flex:none}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;min-height:22px} .card .row{display:flex;justify-content:space-between;color:var(--faint);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.card .check{position:absolute;top:12px;left:12px;width:22px;height:22px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent);opacity:0;transition:opacity .1s} .card:hover .check,.card.selected .check{opacity:1}
.card.selected .check{background:var(--accent);color:var(--accent-fg)}
.listwrap{overflow:auto;padding:0 20px 24px} .listwrap .t{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden} .listwrap .t tr.selected td{background:var(--accent-soft)}
.mini{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--thumb-bg);color:var(--thumb);vertical-align:middle} .mini svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}

/* ---------- inspector ---------- */
.inspector h2{margin:0 0 2px;font-size:20px;font-weight:800;letter-spacing:-.02em;text-wrap:balance} .inspector .sub{color:var(--muted);font-size:12px;margin-bottom:14px;word-break:break-all}
.inspector h3{margin:18px 0 8px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.files{display:grid;gap:4px;font-size:13px} .files div{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:var(--rs);background:var(--bg);color:var(--fg-2);font-weight:600} .files .sz{margin-left:auto;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap} .files .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:12px;color:var(--muted);padding:12px 14px;border-radius:var(--rs);background:var(--accent-soft);margin-top:16px}
.actions{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.insp-thumb{height:0;padding-top:60%;position:relative;border-radius:var(--rs);background:var(--thumb-bg);color:var(--thumb);margin-bottom:14px;overflow:hidden} .insp-thumb svg{position:absolute;inset:0;margin:auto;width:50%;height:50%;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.insp-thumb .badge{position:absolute;right:10px;top:10px}

/* ---------- pages ---------- */
.page-wrap{padding:22px 24px 40px;display:grid;gap:20px;max-width:1200px}
.page-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap} .page-head .grow{flex:1;min-width:200px;display:grid;gap:4px} .page-head .actions{margin:0}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;font-weight:600;flex-wrap:wrap} .crumbs a{color:var(--muted);text-decoration:none} .crumbs a:hover{color:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:20px;align-items:start} .cols-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start}
.stack{display:grid;gap:14px}

/* viewer */
.viewer{position:relative;border-radius:var(--r);background:radial-gradient(120% 80% at 50% 110%,var(--accent-soft),transparent 60%),var(--bg);box-shadow:inset 0 0 0 1px var(--border);height:460px;overflow:hidden;perspective:1100px;touch-action:none;user-select:none}

.obj{position:relative;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-28deg) rotateY(32deg)}
.obj .f{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border:1.5px solid rgba(15,139,141,.9);background:rgba(15,139,141,.10)}
.obj .top{transform:rotateX(90deg) translateZ(24px);background:
  linear-gradient(rgba(15,139,141,.6) 1.5px,transparent 1.5px) 0 0/44px 44px,linear-gradient(90deg,rgba(15,139,141,.6) 1.5px,transparent 1.5px) 0 0/44px 44px,rgba(15,139,141,.18)}
.obj .bottom{transform:rotateX(-90deg) translateZ(24px);background:rgba(15,139,141,.22)}
.obj .side{height:48px;margin-top:-24px;background:rgba(15,139,141,.16)}
.obj .n{transform:rotateY(180deg) translateZ(110px)}
.obj .s{transform:translateZ(110px)}
.obj .w{transform:rotateY(-90deg) translateZ(110px)}
.obj .e{transform:rotateY(90deg) translateZ(110px)}

.viewer .vt{position:absolute;left:14px;top:14px;display:flex;gap:6px;flex-wrap:wrap} .viewer .vt .btn{height:32px;padding:0 12px;font-size:12px}
.viewer .vb{position:absolute;left:14px;right:14px;bottom:12px;display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.viewer .vb .mono{color:var(--fg-2)}
.viewer .legend{position:absolute;right:14px;top:14px;display:grid;gap:6px;text-align:right}

/* dropzone / staging */
.drop{display:grid;place-items:center;text-align:center;gap:6px;padding:28px;border-radius:var(--r);border:2px dashed var(--border-strong);background:var(--panel);color:var(--muted)} .drop b{color:var(--fg);font-size:15px} .drop.over{border-color:var(--accent);background:var(--accent-soft)}
.stage-item{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px 18px;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow)}
.stage-item .ico{width:48px;height:48px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center} .stage-item .ico svg{width:24px;height:24px}
.stage-item h4{margin:0;font-size:15px;font-weight:800} .stage-item .src{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
.stage-item .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:12px}
.stage-item details{margin-top:10px} .stage-item summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:13px}
.filetree{margin:8px 0 0;padding:10px 12px;border-radius:var(--rs);background:var(--bg);font:12px/1.7 var(--mono);color:var(--fg-2);overflow-x:auto} .filetree .d{color:var(--muted)} .filetree .skip{color:var(--faint);text-decoration:line-through}

/* smart collection editor */
.rule{display:grid;grid-template-columns:140px 120px minmax(0,1fr) 36px;gap:8px;align-items:center}
.rule .select,.rule .input{height:36px;box-shadow:none}
.coll-card{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent} .coll-card.on{border-color:var(--accent)}
.coll-card .stackthumb{position:relative;width:64px;height:64px} .coll-card .stackthumb i{position:absolute;inset:0;border-radius:12px;background:var(--thumb-bg);box-shadow:var(--shadow)} .coll-card .stackthumb i:nth-child(1){transform:rotate(-8deg) translate(-3px,2px)} .coll-card .stackthumb i:nth-child(2){transform:rotate(5deg) translate(3px,-1px)} .coll-card .stackthumb i:nth-child(3){display:grid;place-items:center;color:var(--thumb)} .coll-card .stackthumb svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.coll-card h4{margin:0;font-size:15px;font-weight:800} .coll-card p{margin:2px 0 0;color:var(--muted);font-size:12px;font-weight:600}

/* settings */
.settings-nav{display:grid;gap:2px;position:sticky;top:0} .settings-nav a{display:block;padding:8px 12px;border-radius:var(--rs);color:var(--fg-2);font-weight:700;text-decoration:none;font-size:13px} .settings-nav a:hover{background:var(--hover)}
.setting{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)} .setting:last-child{border-bottom:0} .setting b{font-size:14px;display:block} .setting span{color:var(--muted);font-size:12px;font-weight:600}
.root-row{display:grid;grid-template-columns:minmax(0,1fr) 150px 170px auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)} .root-row:last-child{border-bottom:0}
.root-row .path{font-weight:800;display:flex;gap:8px;align-items:center;min-width:0} .root-row .path span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .root-row small{display:block;color:var(--muted);font-weight:600;font-size:12px}

/* activity */
.job{display:grid;grid-template-columns:40px minmax(0,1fr) 160px auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)} .job:last-child{border-bottom:0}
.job .ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center} .job b{display:block;font-size:14px} .job span{color:var(--muted);font-size:12px;font-weight:600}
.log{font:12px/1.7 var(--mono);background:var(--bg);border-radius:var(--rs);padding:12px 14px;max-height:360px;overflow:auto;color:var(--fg-2)} .log .ts{color:var(--faint)} .log .lvl{display:inline-block;width:46px;font-weight:600} .log .INFO{color:var(--accent)} .log .WARN{color:var(--warn)} .log .ERROR{color:var(--danger)}

/* welcome */
.welcome{display:grid;place-items:center;height:100%;overflow:auto;padding:24px}
.welcome .box{max-width:560px;width:100%;display:grid;gap:18px;text-align:center;justify-items:center}
.welcome .box .ico{width:84px;height:84px;border-radius:26px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center} .welcome .box .ico svg{width:40px;height:40px;stroke-width:2}
.welcome h1{margin:0;font-size:30px;letter-spacing:-.02em;text-wrap:balance} .welcome p{margin:0;color:var(--muted);max-width:46ch}
.welcome .opts{display:grid;gap:10px;width:100%;text-align:left;margin-top:6px}
.welcome .opt{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);border:2px solid transparent;cursor:pointer;text-align:left;width:100%} .welcome .opt:hover{border-color:var(--accent)} .welcome a.opt{color:inherit;text-decoration:none} .welcome .opt .ico2{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center} .welcome .opt b{display:block;font-size:14px} .welcome .opt span{color:var(--muted);font-size:12px;font-weight:600}

/* overlays */
.toasts{position:fixed;right:20px;bottom:44px;display:grid;gap:8px;z-index:50}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--rs);background:var(--fg);color:var(--bg);font-weight:700;font-size:13px;box-shadow:var(--shadow-hover);animation:in .18s ease-out} .toast svg{width:16px;height:16px;stroke:var(--accent)} .toast button{color:inherit;opacity:.6;margin-left:6px}
@keyframes in{from{transform:translateY(8px);opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(17,24,39,.45);display:grid;place-items:center;z-index:60;padding:20px}
.dialog{width:min(440px,100%);background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow-hover);padding:22px 24px;display:grid;gap:14px} .dialog h3{margin:0;font-size:18px;letter-spacing:-.01em} .dialog p{margin:0;color:var(--muted)} .dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.menu{position:fixed;z-index:55;min-width:200px;background:var(--panel);border-radius:var(--rs);box-shadow:var(--shadow-hover);padding:6px;display:grid;border:1px solid var(--border)} .menu button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-align:left;font-weight:600;color:var(--fg-2)} .menu button:hover{background:var(--hover)} .menu hr{border:0;border-top:1px solid var(--border);margin:4px 0} .menu button.danger{color:var(--danger)}
.demo-note{position:fixed;left:16px;bottom:44px;z-index:40;max-width:380px;padding:12px 16px;border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow-hover);color:var(--muted);font-size:12px;font-weight:600} .demo-note b{color:var(--fg)} .demo-note button{float:right;color:var(--faint);margin-left:8px}
.kbd{font:11px/1 var(--mono);padding:2px 6px;border-radius:5px;border:1px solid var(--border);background:var(--bg);color:var(--muted)}

/* responsive (the real app is desktop-only; this keeps the dummy usable on a phone) */
@media (max-width:1100px){ .body{grid-template-columns:230px minmax(0,1fr)} .inspector{display:none} .body.no-side{grid-template-columns:minmax(0,1fr)} }
@media (max-width:760px){
  .body,.body.no-inspector{grid-template-columns:minmax(0,1fr)} .sidebar{display:none}
  .topbar{padding:0 max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-left,0px));gap:4px} .mainnav a span.l{display:none} .mainnav a{padding:0 10px} .brand span.t{display:none} .search{width:auto;flex:1} .search kbd{display:none}
  .toolbar{padding:12px 14px 6px} .grid{padding:8px 14px 20px;gap:12px} .page-wrap{padding:16px 14px 32px} .two{grid-template-columns:1fr} .rule{grid-template-columns:1fr 1fr} .root-row,.job{grid-template-columns:1fr} .statusbar .right{display:none} .demo-note{display:none} .viewer{height:320px} .caption .ibtn:not(#themeBtn){display:none} .search{min-width:0}
}

/* ================= smart collection evaluation ================= */
function matchRule(p, r) {
  const v = (r.value||'').toLowerCase();
  const has = (a) => a.some(x => x.toLowerCase()===v);
  let hit;
  switch (r.field) {
    case 'tag': hit = has(p.tags); break;
    case 'creator': hit = (p.creator||'').toLowerCase().includes(v); break;
    case 'license': hit = (p.license||'').toLowerCase().includes(v); break;
    case 'material': hit = (p.material||'').toLowerCase().split(' ')[0]===v; break;
    case 'filetype': hit = p.files.some(x => x.kind===v); break;
    case 'sidecar': hit = p.sidecar === (v==='yes'); break;
    case 'supports': hit = p.supports === (v==='yes'); break;
    case 'added': hit = r.op==='after' ? p.added > r.value : p.added < r.value; return hit;
    default: hit = false;
  }
  if (r.op==='is not' || r.op==='does not contain') hit = !hit;
  return hit;
}
const smartMatches = s => PROJECTS.filter(p => !p.inbox && (s.match==='all' ? s.rules.every(r=>matchRule(p,r)) : s.rules.some(r=>matchRule(p,r))));

  if (fl.kind==='favorites') list = list.filter(p=>p.fav);
  if (fl.kind==='inbox') list = list.filter(p=>p.inbox);
  if (fl.kind==='smart') { const s = SMART.find(x=>x.id===fl.id); list = s ? smartMatches(s) : []; }
  if (fl.kind==='collection') { const c = COLLECTIONS.find(x=>x.id===fl.id); list = c ? c.projects.map(byId).filter(Boolean) : []; }
  if (fl.kind==='folder') list = list.filter(p => p.root===fl.root && (fl.path==='' || p.folder===fl.path || p.folder.startsWith(fl.path+'/')));
  if (state.q) { const q = state.q.toLowerCase(); list = list.filter(p => [p.title,p.creator,p.description,...p.tags,...p.files.map(x=>x.name)].join(' ').toLowerCase().includes(q)); }
  for (const t of state.tags) list = list.filter(p => p.tags.includes(t));
  const cmp = { added:(a,b)=>b.added.localeCompare(a.added), title:(a,b)=>a.title.localeCompare(b.title), size:(a,b)=>sizeNum(b.size)-sizeNum(a.size), creator:(a,b)=>(a.creator||'~').localeCompare(b.creator||'~') }[state.sort];
  return list.sort(cmp);
}

function toast(msg, icon='check') { const t = document.createElement('div'); t.className='toast'; t.innerHTML = ic(icon)+`<span>${msg}</span><button aria-label="Dismiss">${ic('x')}</button>`; t.querySelector('button').onclick=()=>t.remove(); $('#toasts').appendChild(t); setTimeout(()=>t.remove(), 4200); }
function dialog({title, body='', confirm='OK', cancel='Cancel', danger=false, input=null, onConfirm}) {
  const o = document.createElement('div'); o.className='overlay';
  o.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">${title}</h3>${body?`<p>${body}</p>`:''}${input!==null?`<input class="input" id="dlgIn" value="${esc(input)}">`:''}<div class="row"><button class="btn ghost" data-c>${cancel}</button><button class="btn ${danger?'danger':'primary'}" data-ok>${confirm}</button></div></div>`;
  const close = () => o.remove();
  o.addEventListener('click', e => { if (e.target===o) close(); });
  o.querySelector('[data-c]').onclick = close;
  o.querySelector('[data-ok]').onclick = () => { const v = o.querySelector('#dlgIn')?.value; close(); onConfirm && onConfirm(v); };
  document.body.appendChild(o);
  const inp = o.querySelector('#dlgIn'); if (inp) { inp.focus(); inp.select(); inp.addEventListener('keydown', e => { if (e.key==='Enter') o.querySelector('[data-ok]').click(); }); } else o.querySelector('[data-ok]').focus();
  o.addEventListener('keydown', e => { if (e.key==='Escape') close(); });
}
let menuEl = null;
function menu(x, y, items) {
  closeMenu(); menuEl = document.createElement('div'); menuEl.className='menu'; menuEl.setAttribute('role','menu');

  let i = 0; $$('button', menuEl).forEach(b => { const it = items.filter(x=>x!=='-')[i++]; b.onclick = () => { closeMenu(); it.run && it.run(); }; });
  document.body.appendChild(menuEl);
  const r = menuEl.getBoundingClientRect(); menuEl.style.left = Math.min(x, innerWidth - r.width - 8) + 'px'; menuEl.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
}

function pageLibrary() {

  const body = $('#body'); body.className = 'body';
  const toolbar = `<div class="toolbar">
    <h1 class="page" style="font-size:18px;margin-right:6px">${esc(filterTitle())}</h1><span class="muted" style="font-weight:600">${list.length}</span>

    ${state.q?`<span class="chip">“${esc(state.q)}”<button data-clearq aria-label="Clear search">${ic('x')}</button></span>`:''}
    <button class="btn ghost" data-act="filter">${ic('plus')}Filter</button>
    <label class="select">Sort <select id="sort"><option value="added" ${state.sort==='added'?'selected':''}>Date added</option><option value="title" ${state.sort==='title'?'selected':''}>Title</option><option value="creator" ${state.sort==='creator'?'selected':''}>Creator</option><option value="size" ${state.sort==='size'?'selected':''}>Size</option></select></label>
    <div class="seg" role="group" aria-label="View"><button class="${state.view==='grid'?'on':''}" data-view="grid">${ic('grid')}Grid</button><button class="${state.view==='list'?'on':''}" data-view="list">${ic('list')}List</button></div>

  let content;

  else if (state.view==='grid') content = `<div class="grid" id="grid" style="--tile:${state.zoom}px">${list.map(cardHTML).join('')}</div>`;
  else content = `<div class="listwrap"><table class="t"><thead><tr><th style="width:56px"></th><th><button data-sort="title">Title ${state.sort==='title'?'↓':''}</button></th><th><button data-sort="creator">Creator ${state.sort==='creator'?'↓':''}</button></th><th>Tags</th><th class="num">Files</th><th class="num"><button data-sort="size">Size ${state.sort==='size'?'↓':''}</button></th><th class="num"><button data-sort="added">Added ${state.sort==='added'?'↓':''}</button></th><th></th></tr></thead><tbody>
    ${list.map(p=>`<tr class="card ${state.selected.has(p.id)?'selected':''}" data-id="${p.id}" tabindex="0" style="display:table-row;transform:none;box-shadow:none;border:0"><td><span class="mini">${th(p.thumb,'')}</span></td><td><b>${esc(p.title)}</b>${p.offline?` <span class="badge off">Offline</span>`:''}<br><span class="muted mono" style="font-size:11px">${esc(p.folder)}</span></td><td>${esc(p.creator)||'<span class="muted">—</span>'}</td><td><div style="display:flex;gap:4px;flex-wrap:wrap">${p.tags.map(t=>`<button class="tag" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div></td><td class="num">${p.files.length}</td><td class="num">${p.size}</td><td class="num">${fmtDate(p.added)}</td><td><button class="ibtn sm" data-menu="${p.id}" aria-label="More">${ic('more')}</button></td></tr>`).join('')}
    </tbody></table></div>`;
  body.innerHTML = sidebarHTML() + `<main class="main">${toolbar}${content}</main>` + inspectorHTML(list);
  $('#selCount').textContent = `${state.selected.size} selected`;

  // wiring
  $$('[data-filter]', body).forEach(b => b.onclick = () => { const [k,id] = b.dataset.filter.split(':'); state.filter = id ? {kind:k,id} : {kind:k}; state.selected.clear(); render(); });
  $$('[data-folder]', body).forEach(b => b.onclick = () => { const [root,path] = b.dataset.folder.split('|'); state.filter = {kind:'folder',root,path}; state.selected.clear(); render(); });
  $$('[data-tag]', body).forEach(b => b.onclick = e => { e.stopPropagation(); const t = b.dataset.tag; if (!state.tags.includes(t)) state.tags.push(t); render(); });
  $$('[data-untag]', body).forEach(b => b.onclick = () => { state.tags = state.tags.filter(t=>t!==b.dataset.untag); render(); });

  $('[data-act="clearfilters"]', body) && ($('[data-act="clearfilters"]', body).onclick = () => { state.q=''; $('#q').value=''; state.tags=[]; render(); });
  $('#sort').onchange = e => { state.sort = e.target.value; render(); };
  $$('[data-sort]', body).forEach(b => b.onclick = () => { state.sort = b.dataset.sort; render(); });
  $$('[data-view]', body).forEach(b => b.onclick = () => { state.view = b.dataset.view; persist(); render(); });
  $('#zoom').oninput = e => { state.zoom = +e.target.value; persist(); const g = $('#grid'); if (g) g.style.setProperty('--tile', state.zoom+'px'); };
  $('[data-act="filter"]', body).onclick = e => menu(e.clientX, e.clientY, [
    {icon:'tag', label:'Tag…', run:()=>menuFromCenter([...new Set(PROJECTS.flatMap(p=>p.tags))].sort().map(t=>({icon:'tag',label:t,run:()=>{state.tags.push(t);render();}})))},
    {icon:'file', label:'File type: 3MF', run:()=>{ state.q='.3mf'; $('#q').value='.3mf'; render(); }},
    {icon:'layers', label:'Material: PLA', run:()=>{ state.q='PLA'; $('#q').value='PLA'; render(); }},
    {icon:'clock', label:'Added this month', run:()=>toast('Date filters come with the real filter builder','info')},
  ]);
  $$('.card', body).forEach(c => {
    const id = c.dataset.id;
    c.addEventListener('click', e => { if (e.target.closest('[data-tag],[data-addtag],[data-menu]')) return; if (e.ctrlKey||e.metaKey) { state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id); } else if (e.shiftKey && state.selected.size) { const ids = list.map(p=>p.id); const a = ids.indexOf([...state.selected].pop()), b = ids.indexOf(id); ids.slice(Math.min(a,b), Math.max(a,b)+1).forEach(x=>state.selected.add(x)); } else { state.selected.clear(); state.selected.add(id); } state.current = id; render(); });
    c.addEventListener('dblclick', () => openProject(id));
    c.addEventListener('contextmenu', e => projectMenu(e, id));
    c.addEventListener('keydown', e => { if (e.key==='Enter') openProject(id); if (e.key===' ') { e.preventDefault(); c.click(); } });
  });
  $$('[data-menu]', body).forEach(b => b.onclick = e => { e.stopPropagation(); const r = b.getBoundingClientRect(); projectMenu({preventDefault(){}, clientX:r.left, clientY:r.bottom}, b.dataset.menu); });
  const cur = [...state.selected][0];

  if (insp) {
    $$('[data-act]', insp).forEach(b => b.onclick = e => { const a = b.dataset.act; if (a==='open') openProject(cur); if (a==='fav') toggleFav(cur); if (a==='reveal') toast(`Opened folder in Explorer`, 'open'); if (a==='menu') projectMenu({preventDefault(){}, clientX:e.clientX, clientY:e.clientY}, cur); if (a==='del-sel') deleteProjects([...state.selected]); if (a==='coll-sel') addToCollection([...state.selected]); if (a==='addtag-sel') dialog({title:`Add a tag to ${state.selected.size} projects`, input:'', confirm:'Add', onConfirm:v=>{ [...state.selected].forEach(id=>addTag(id,v)); }}); });
    $$('[data-rmtag]', insp).forEach(b => b.onclick = () => removeTag(cur, b.dataset.rmtag));
  }
  $$('[data-addtag]', body).forEach(b => b.onclick = e => { e.stopPropagation(); const id = b.closest('.card')?.dataset.id || cur; dialog({title:'Add tag', body: byId(id).sidecar ? 'Saved to project.yaml in the background.' : 'This project has no project.yaml yet. It will be created now, next to the model files.', input:'', confirm:'Add tag', onConfirm:v=>addTag(id,v)}); });
}

    v.addEventListener('pointerdown', e => { if (e.target.closest('button,select,label')) return; drag = {x:e.clientX, y:e.clientY, rx, ry}; v.setPointerCapture(e.pointerId); });

    apply();

  $('#newColl').onclick = () => dialog({title:'New collection', input:'', confirm:'Create', onConfirm:v=>{ if(!v) return; COLLECTIONS.push({id:'c'+Date.now(), name:v, projects:[]}); toast(`Created "${esc(v)}". Add projects from the library via right-click.`,'collection'); render(); }});
}

function pageSettings() {

  body.innerHTML = `<main class="main scroll"><div class="page-wrap" style="grid-template-columns:180px minmax(0,1fr);gap:28px;align-items:start">
    <nav class="settings-nav"><a href="#settings">Library roots</a><a href="#settings">Ignore patterns</a><a href="#settings">Thumbnails</a><a href="#settings">Appearance</a><a href="#settings">Updates</a><a href="#settings">Privacy</a><a href="#settings">About</a></nav>
    <div class="stack" style="gap:20px">
      <h1 class="page">Settings</h1>

        ${ROOTS.map(r=>`<div class="root-row"><div class="path">${ic('folder')}<span>${esc(r.path)}<small>${r.projects.toLocaleString()} projects · ${r.size} · last sync ${r.lastSync}</small></span></div>
          <label class="select" style="box-shadow:none"><select data-mode="${r.id}"><option value="watch" ${r.mode==='watch'?'selected':''}>Watch events</option><option value="poll" ${r.mode==='poll'?'selected':''}>Poll (15 min)</option><option value="manual" ${r.mode==='manual'?'selected':''}>Manual only</option></select></label>
          <div>${r.status==='offline'?`<span class="badge warn">${ic('cloudoff')} offline, kept</span>`:`<span class="badge ok">${ic('check')} online</span>`}</div>
          <div style="display:flex;gap:4px"><button class="ibtn sm" title="Rescan" data-rescan>${ic('refresh')}</button><button class="ibtn sm" title="Remove root" data-rmroot="${r.id}">${ic('trash')}</button></div></div>`).join('')}
        <p class="muted" style="margin:10px 0 0;font-size:12px">Network shares usually cannot deliver file events. Use polling there. Removing a root forgets its index; files on disk are never touched.</p></section>
      <section class="card-panel"><h2 class="sec-title" style="margin-bottom:6px">Ignore patterns</h2><p class="muted" style="margin:0 0 10px;font-size:12px">Glob patterns excluded from scans. Changes apply on the next scan.</p>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center" id="pats">${patterns.map(p=>`<button class="tag" data-pat="${esc(p)}" title="Remove">${esc(p)} ${ic('x')}</button>`).join('')}<input class="input" id="newPat" placeholder="add pattern, Enter" style="width:180px;height:30px"></div></section>
      <section class="card-panel"><h2 class="sec-title" style="margin-bottom:10px">Thumbnails</h2>
        <div class="radio-cards" id="thumbLoc"><label class="radio-card on"><b>Inside each project</b><span>&lt;project&gt;\\.cache\\preview.png · travels with the project, regenerated if deleted</span></label><label class="radio-card"><b>App data</b><span>%LOCALAPPDATA%\\My Meshes\\thumbs · keeps project folders clean, lost on reinstall</span></label><label class="radio-card"><b>Library root</b><span>&lt;root&gt;\\.mymeshes\\thumbs · one cache folder per root</span></label></div>
        <div class="setting" style="margin-top:8px"><div><b>Render size</b><span>Larger thumbnails look better at high zoom and cost disk space.</span></div><label class="select" style="box-shadow:none"><select><option>512 px (default)</option><option>256 px</option><option>1024 px</option></select></label></div>
        <div class="setting"><div><b>Render while I work</b><span>Off: thumbnails render only when the app is idle.</span></div><button class="switch" role="switch" aria-checked="true" data-sw></button></div></section>
      <section class="card-panel"><h2 class="sec-title" style="margin-bottom:6px">Appearance</h2>

      <section class="card-panel"><h2 class="sec-title" style="margin-bottom:6px">Privacy</h2>

      <section class="card-panel"><h2 class="sec-title" style="margin-bottom:6px">About</h2>
        <dl class="kv"><dt>Data folder</dt><dd class="mono">%APPDATA%\\My Meshes</dd><dt>Index</dt><dd>index.sqlite · 86 MB · rebuildable</dd><dt>Collections</dt><dd>collections.json · 2 collections · ${SMART.length} smart</dd><dt>Engine</dt><dd>Tauri 2 · Rust engine 0.1.0</dd></dl>
        <div class="actions"><button class="btn sm" id="openLogs">${ic('open')}Open logs folder</button><button class="btn sm" id="rebuild">${ic('refresh')}Rebuild index</button></div></section>
    </div></div></main>`;
  $('#selCount').textContent='';
  $$('[data-theme-set]', body).forEach(b => b.onclick = () => { setTheme(b.dataset.themeSet); render(); });

  $$('[data-rescan]', body).forEach(b => b.onclick = () => toast('Rescan queued','scan'));

  $('#addRoot').onclick = () => toast('Native folder picker opens here. On macOS this is also how sandbox access is granted.','folder');

  $$('[data-pat]', body).forEach(b => b.onclick = () => { b.remove(); toast('Pattern removed','check'); });
  $('#lang').onchange = () => toast('Language switching is wired in the real app (i18n keys everywhere)','info');
  $('#chk').onclick = () => { const b=$('#chk'); b.disabled=true; b.innerHTML=ic('refresh')+'Checking…'; setTimeout(()=>{ b.disabled=false; b.innerHTML=ic('refresh')+'Check for updates'; toast('You are up to date (0.1.0-dev)','check'); }, 1000); };
  $('#openLogs').onclick = () => toast('Opened %APPDATA%\\My Meshes\\logs','open');
  $('#rebuild').onclick = () => dialog({title:'Rebuild the index?', body:'The SQLite cache is deleted and rebuilt from disk. Takes about a minute for this library. No metadata is lost because everything lives in the files.', confirm:'Rebuild', onConfirm:()=>toast('Rebuilding index in the background','refresh')});
}

    <h1>Your 3D models, organized like a photo library</h1>

      <button class="opt" id="w1"><span class="ico2">${ic('folder')}</span><span><b>Add a library folder</b><span>Pick the folder where your models live. Subfolders are scanned as projects.</span></span>${ic('chev')}</button>

/* ================= router & global wiring ================= */
const PAGES = { library:pageLibrary, project:pageProject, import:pageImport, collections:pageCollections, activity:pageActivity, settings:pageSettings, welcome:pageWelcome };
function route() { const h = location.hash.replace('#','') || 'library'; return PAGES[h] ? h : 'library'; }
function render() {
  closeMenu(); const r = route();
  $$('#mainnav a').forEach(a => a.classList.toggle('active', a.dataset.nav===r || (r==='project' && a.dataset.nav==='library')));
  PAGES[r]();
  const sb = $('#statusbar'); sb.style.display = r==='welcome' ? 'none' : '';
  $('#themeBtn').setAttribute('aria-pressed', document.documentElement.getAttribute('data-theme')==='dark');
}
window.addEventListener('hashchange', render);
$('#q').addEventListener('input', e => { state.q = e.target.value; if (route()!=='library') location.hash='library'; else render(); });
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (e.key==='Escape') { closeMenu(); if (document.activeElement===$('#q')) { $('#q').blur(); } else if (state.selected.size) { state.selected.clear(); render(); } return; }
  if (typing) return;
  if (route()==='library' && state.selected.size) {
    if (e.key==='Delete') { e.preventDefault(); deleteProjects([...state.selected]); }
    if (e.key==='F2') { e.preventDefault(); renameProject([...state.selected][0]); }
    if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a') { e.preventDefault(); visibleProjects().forEach(p=>state.selected.add(p.id)); render(); }
  }
  if (route()==='project' && e.key==='F2') { e.preventDefault(); renameProject(state.current); }
});
function setTheme(t) { const root = document.documentElement; if (t==='system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t); try { localStorage.setItem('mm-theme', t); } catch(e){} }
$('#themeBtn').onclick = () => { const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); setTheme(cur==='dark' ? 'light' : 'dark'); render(); };
try { const t = localStorage.getItem('mm-theme'); if (t && t!=='system') document.documentElement.setAttribute('data-theme', t); } catch(e){}
if (!location.hash) location.hash = 'welcome';
render();
</script>
